name: Build Yemen Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-yemen-map:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # تحميل المشروع
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # إعداد Java
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================
      # تثبيت أدوات النظام
      # =========================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip osmium-tool

      # =========================
      # تحميل بيانات اليمن من Geofabrik
      # =========================
      - name: Download Yemen OSM data
        run: |
          wget -O yemen-latest.osm.pbf \
            https://download.geofabrik.de/asia/yemen-latest.osm.pbf

      # =========================
      # تحميل Mapsforge Map-Writer 0.25.0
      # =========================
      - name: Download Mapsforge Map-Writer 0.25.0
        run: |
          wget -O mapsforge-map-writer-0.25.0.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

      # =========================
      # إنشاء مجلد الإخراج
      # =========================
      - name: Create output directory
        run: |
          mkdir -p map-output

      # =========================
      # إنشاء Yemen.map
      # =========================
      - name: Generate Yemen.map
        run: |
          java -Xmx6g -jar mapsforge-map-writer-0.25.0.jar \
            --map-file=yemen-latest.osm.pbf \
            --output-dir=map-output \
            --map-start-position=15.5527,48.5164 \
            --map-start-zoom=6 \
            --preferred-language=ar

      # =========================
      # التحقق من الملف
      # =========================
      - name: Check generated map
        run: |
          echo "=== MAP OUTPUT ==="
          ls -lh map-output/

          if [ ! -f map-output/Yemen.map ]; then
            echo "Yemen.map was not created."
            exit 1
          fi

          echo "Yemen.map created successfully."
          du -h map-output/Yemen.map

      # =========================
      # رفع الخريطة كـ Artifact
      # =========================
      - name: Upload Yemen.map
        uses: actions/upload-artifact@v4
        with:
          name: Yemen-map-0.25.0
          path: map-output/Yemen.map
          compression-level: 0
