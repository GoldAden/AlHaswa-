name: Build Yemen Offline Vector Map

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  build-yemen-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Osmosis 0.47.4
        run: |
          wget -q \
            https://github.com/openstreetmap/osmosis/releases/download/0.47.4/osmosis-0.47.4.zip \
            -O osmosis.zip

          unzip -q osmosis.zip -d osmosis
          chmod +x osmosis/bin/osmosis
          echo "$(pwd)/osmosis/bin" >> "$GITHUB_PATH"

      - name: Install Mapsforge Map-Writer 0.30.0
        run: |
          mkdir -p ~/.openstreetmap/osmosis/plugins

          wget -q \
            https://github.com/mapsforge/mapsforge/releases/download/0.30.0/mapsforge-map-writer-0.30.0-jar-with-dependencies.jar \
            -O ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer-0.30.0-jar-with-dependencies.jar

      - name: Download Yemen OSM data
        run: |
          wget -q \
            https://download.geofabrik.de/asia/yemen-latest.osm.pbf \
            -O yemen-latest.osm.pbf

          ls -lh yemen-latest.osm.pbf

      - name: Convert Yemen OSM to Mapsforge Vector Map
        env:
          JAVACMD_OPTIONS: "-Xmx3G"
        run: |
          osmosis \
            --rb file=yemen-latest.osm.pbf \
            --mw file=Yemen.map type=ram

      - name: Put map in Android assets
        run: |
          mkdir -p app/src/main/assets
          cp Yemen.map app/src/main/assets/Yemen.map
          ls -lh app/src/main/assets/Yemen.map

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Track Yemen.map with Git LFS
        run: |
          git lfs track "app/src/main/assets/Yemen.map"
          git add .gitattributes
          git add app/src/main/assets/Yemen.map

      - name: Commit Yemen.map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Yemen offline vector map"
            git push
          fi

      - name: Verify Yemen.map
        run: |
          if [ ! -s app/src/main/assets/Yemen.map ]; then
            echo "ERROR: Yemen.map was not created."
            exit 1
          fi

          echo "Yemen.map is ready:"
          ls -lh app/src/main/assets/Yemen.map
