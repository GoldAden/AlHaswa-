name: Build World Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-map:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip osmium-tool gdal-bin python3-pip

      - name: Install ogr2osm
        run: |
          python3 -m pip install --break-system-packages ogr2osm

      - name: Create directories
        run: |
          mkdir -p world-data
          mkdir -p map-output
          mkdir -p tools

      - name: Download world land polygons
        run: |
          wget -O world-data/land.zip \
            https://osmdata.openstreetmap.de/download/simplified-land-polygons-complete-3857.zip

          unzip -o world-data/land.zip \
            -d world-data/land

      - name: Find land shapefile
        run: |
          LAND_SHP=$(find world-data/land \
            -type f \
            -name "*.shp" \
            | head -n 1)

          if [ -z "$LAND_SHP" ]; then
            echo "Land shapefile was not found."
            exit 1
          fi

          echo "LAND_SHP=$LAND_SHP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$LAND_SHP"

      - name: Convert land polygons to OSM
        run: |
          ogr2osm \
            "$LAND_SHP" \
            -o world-land.osm

      - name: Download Natural Earth countries
        run: |
          wget -O world-data/countries.zip \
            https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip

          mkdir -p world-data/countries

          unzip -o world-data/countries.zip \
            -d world-data/countries

      - name: Create Natural Earth translation
        run: |
          cat > tools/ne_countries.py <<'PY'
          def filterFeature(attrs):
              return True

          def translateAttributes(attrs):
              tags = {}

              name = attrs.get("NAME")
              if name:
                  tags["name"] = str(name)

              iso = attrs.get("ISO_A2")
              if iso and iso != "-99":
                  tags["ISO3166-1"] = str(iso)

              tags["boundary"] = "administrative"
              tags["admin_level"] = "2"

              return tags
          PY

      - name: Find country shapefile
        run: |
          COUNTRY_SHP=$(find world-data/countries \
            -type f \
            -name "ne_110m_admin_0_countries.shp" \
            | head -n 1)

          if [ -z "$COUNTRY_SHP" ]; then
            echo "Country shapefile was not found."
            exit 1
          fi

          echo "COUNTRY_SHP=$COUNTRY_SHP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$COUNTRY_SHP"

      - name: Convert countries to OSM
        run: |
          ogr2osm \
            "$COUNTRY_SHP" \
            -o world-countries.osm \
            -t tools/ne_countries.py

      - name: Add land tags
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          input_file = "world-land.osm"
          output_file = "world-land-tagged.osm"

          tree = ET.parse(input_file)
          root = tree.getroot()

          for way in root.findall("way"):
              has_natural = False

              for tag in way.findall("tag"):
                  if tag.attrib.get("k") == "natural":
                      has_natural = True
                      break

              if not has_natural:
                  ET.SubElement(
                      way,
                      "tag",
                      {
                          "k": "natural",
                          "v": "land"
                      }
                  )

          tree.write(
              output_file,
              encoding="UTF-8",
              xml_declaration=True
          )

          print("Land tags added.")
          PY

      - name: Convert land to PBF
        run: |
          osmium cat \
            world-land-tagged.osm \
            -o world-land.pbf \
            -f pbf

      - name: Convert countries to PBF
        run: |
          osmium cat \
            world-countries.osm \
            -o world-countries.pbf \
            -f pbf

      # ترتيب الملفات قبل الدمج
      - name: Sort land PBF
        run: |
          osmium sort \
            world-land.pbf \
            -o world-land-sorted.pbf \
            -f pbf

      - name: Sort countries PBF
        run: |
          osmium sort \
            world-countries.pbf \
            -o world-countries-sorted.pbf \
            -f pbf

      # دمج الملفات المرتبة
      - name: Merge world data
        run: |
          osmium merge \
            world-land-sorted.pbf \
            world-countries-sorted.pbf \
            -o world.pbf \
            -f pbf \
            --overwrite

      - name: Download Mapsforge Map Writer 0.25.0
        run: |
          wget -O mapsforge-map-writer-0.25.0-jar-with-dependencies.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

          ls -lh mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

      - name: Verify Map Writer
        run: |
          file mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

          jar tf mapsforge-map-writer-0.25.0-jar-with-dependencies.jar \
            | head -n 20

      - name: Generate World.map
        run: |
          java -Xmx6g \
            -jar mapsforge-map-writer-0.25.0-jar-with-dependencies.jar \
            --map-file=world.pbf \
            --output-dir=map-output \
            --map-start-position=15,45 \
            --map-start-zoom=2 \
            --preferred-language=en

      - name: Check World.map
        run: |
          echo "=== MAP OUTPUT ==="
          ls -lh map-output/

          if [ ! -f map-output/World.map ]; then
            echo "World.map was not created."
            exit 1
          fi

          echo "World.map created successfully."

          du -h map-output/World.map

      - name: Upload World.map
        uses: actions/upload-artifact@v4
        with:
          name: World-map-0.25.0
          path: map-output/World.map
          compression-level: 0
