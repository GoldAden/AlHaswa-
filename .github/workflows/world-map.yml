name: Test Mapsforge Map Writer

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Mapsforge Map Writer 0.25.0
        run: |
          wget -O mapsforge-map-writer.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

      - name: Inspect Map Writer
        run: |
          echo "=== JAR CONTENT ==="

          jar tf mapsforge-map-writer.jar \
            | grep -E "osmosis|MapFileWriter|MapWriter" \
            | head -n 100

      - name: Check Manifest
        run: |
          echo "=== MANIFEST ==="

          unzip -p mapsforge-map-writer.jar META-INF/MANIFEST.MF || true

      - name: Find Osmosis classes
        run: |
          echo "=== OSMOSIS CLASSES ==="

          jar tf mapsforge-map-writer.jar \
            | grep -i "osmosis" \
            | head -n 100

      - name: Find Map Writer classes
        run: |
          echo "=== MAP WRITER CLASSES ==="

          jar tf mapsforge-map-writer.jar \
            | grep "org/mapsforge/map/writer" \
            | head -n 100
