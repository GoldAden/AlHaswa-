name: Build World.map

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Osmosis
        run: |
          wget -q https://github.com/openstreetmap/osmosis/releases/download/0.48.3/osmosis-0.48.3.tgz
          tar xzf osmosis-0.48.3.tgz

          mkdir -p ~/.openstreetmap/osmosis/plugins

          wget -q https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar \
            -O ~/.openstreetmap/osmosis/plugins/writer.jar

          ls -lh ~/.openstreetmap/osmosis/plugins/

      - name: Create test world OSM
        run: |
          mkdir -p work

          cat > work/world.osm << 'OSM'
          <?xml version="1.0" encoding="UTF-8"?>
          <osm version="0.6" generator="AlHaswa">

            <node id="1" lat="-85" lon="-180"/>
            <node id="2" lat="-85" lon="180"/>
            <node id="3" lat="85" lon="180"/>
            <node id="4" lat="85" lon="-180"/>

            <way id="1">
              <nd ref="1"/>
              <nd ref="2"/>
              <nd ref="3"/>
              <nd ref="4"/>
              <nd ref="1"/>
              <tag k="natural" v="land"/>
            </way>

            <node id="10" lat="15.3694" lon="44.1910">
              <tag k="place" v="city"/>
              <tag k="name" v="اليمن"/>
            </node>

            <node id="11" lat="24.0000" lon="46.0000">
              <tag k="place" v="city"/>
              <tag k="name" v="السعودية"/>
            </node>

          </osm>
          OSM

      - name: Build World.map
        run: |
          OSMOSIS_BIN=$(find . -type f -name osmosis | head -n 1)

          chmod +x "$OSMOSIS_BIN"

          "$OSMOSIS_BIN" \
            --rx file=work/world.osm \
            --mw file=work/World.map \
            bbox=-85,-180,85,180 \
            map-start-position=15,45 \
            map-start-zoom=2

          ls -lh work/World.map

          echo "======================================"
          echo "SUCCESS - World.map created"
          echo "======================================"

      - name: Upload World.map
        uses: actions/upload-artifact@v4
        with:
          name: World-map
          path: work/World.map
