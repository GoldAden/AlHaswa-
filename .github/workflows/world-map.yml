name: Build World Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-map:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            osmium-tool \
            gdal-bin \
            python3-pip

      - name: Install ogr2osm
        run: |
          python3 -m pip install --break-system-packages ogr2osm

      - name: Create directories
        run: |
          mkdir -p world-data
          mkdir -p map-output
          mkdir -p tools

      # --------------------------------------------------
      # Download simplified world land polygons
      # --------------------------------------------------

      - name: Download world land polygons
        run: |
          wget -O world-data/land.zip \
            https://osmdata.openstreetmap.de/download/simplified-land-polygons-complete-3857.zip

          unzip -o world-data/land.zip \
            -d world-data/land

      # --------------------------------------------------
      # Find land shapefile
      # --------------------------------------------------

      - name: Find land shapefile
        run: |
          echo "Searching for shapefile..."

          LAND_SHP=$(find world-data/land \
            -type f \
            -name "*.shp" \
            | head -n 1)

          if [ -z "$LAND_SHP" ]; then
            echo "Land shapefile was not found."
            exit 1
          fi

          echo "LAND_SHP=$LAND_SHP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$LAND_SHP"

      # --------------------------------------------------
      # Convert land polygons to OSM
      # --------------------------------------------------

      - name: Convert land polygons to OSM
        run: |
          ogr2osm \
            "$LAND_SHP" \
            -o world-land.osm

      # --------------------------------------------------
      # Download Natural Earth countries
      # --------------------------------------------------

      - name: Download Natural Earth countries
        run: |
          wget -O world-data/countries.zip \
            https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip

          mkdir -p world-data/countries

          unzip -o world-data/countries.zip \
            -d world-data/countries

      # --------------------------------------------------
      # Create Natural Earth translation
      # --------------------------------------------------

      - name: Create Natural Earth translation
        run: |
          cat > tools/ne_countries.py <<'PY'
          def filterFeature(attrs):
              return True


          def translateAttributes(attrs):
              tags = {}

              name = attrs.get("NAME")

              if name:
                  tags["name"] = str(name)

              iso = attrs.get("ISO_A2")

              if iso and iso != "-99":
                  tags["ISO3166-1"] = str(iso)

              tags["boundary"] = "administrative"
              tags["admin_level"] = "2"

              return tags
          PY

      # --------------------------------------------------
      # Find country shapefile
      # --------------------------------------------------

      - name: Find country shapefile
        run: |
          COUNTRY_SHP=$(find world-data/countries \
            -type f \
            -name "ne_110m_admin_0_countries.shp" \
            | head -n 1)

          if [ -z "$COUNTRY_SHP" ]; then
            echo "Country shapefile was not found."
            exit 1
          fi

          echo "COUNTRY_SHP=$COUNTRY_SHP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$COUNTRY_SHP"

      # --------------------------------------------------
      # Convert countries to OSM
      # --------------------------------------------------

      - name: Convert countries to OSM
        run: |
          ogr2osm \
            "$COUNTRY_SHP" \
            -o world-countries.osm \
            -t tools/ne_countries.py

      # --------------------------------------------------
      # Add land tag to land polygons
      # --------------------------------------------------

      - name: Add land tags
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          input_file = "world-land.osm"
          output_file = "world-land-tagged.osm"

          tree = ET.parse(input_file)
          root = tree.getroot()

          max_id = 0

          for element in root:
              if element.tag == "way":
                  try:
                      element_id = int(element.attrib.get("id", "0"))
                      max_id = max(max_id, abs(element_id))
                  except:
                      pass

          for way in root.findall("way"):
              tag = way.find("tag")

              if tag is None:
                  ET.SubElement(
                      way,
                      "tag",
                      {
                          "k": "natural",
                          "v": "land"
                      }
                  )

          tree.write(
              output_file,
              encoding="UTF-8",
              xml_declaration=True
          )

          print("Land tags added.")
          PY

      # --------------------------------------------------
      # Convert OSM XML to PBF
      # --------------------------------------------------

      - name: Convert land to PBF
        run: |
          osmium cat \
            world-land-tagged.osm \
            -o world-land.pbf \
            --overwrite

      - name: Convert countries to PBF
        run: |
          osmium cat \
            world-countries.osm \
           
