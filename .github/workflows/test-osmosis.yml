name: Inspect Mapsforge Writer Options

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Mapsforge Map Writer
        run: |
          wget -O mapsforge-map-writer.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

      - name: Inspect Factory
        run: |
          echo "===== FACTORY ====="
          javap -classpath mapsforge-map-writer.jar \
            org.mapsforge.map.writer.osmosis.MapFileWriterFactory

          echo ""
          echo "===== TASK ====="
          javap -classpath mapsforge-map-writer.jar \
            org.mapsforge.map.writer.osmosis.MapFileWriterTask

          echo ""
          echo "===== PLUGIN LOADER ====="
          javap -classpath mapsforge-map-writer.jar \
            org.mapsforge.map.writer.osmosis.MapFileWriterPluginLoader
