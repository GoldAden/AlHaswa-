name: Inspect Mapsforge Writer

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download Mapsforge Map Writer
        run: |
          wget -O mapsforge-map-writer.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar

      - name: Inspect plugin configuration
        run: |
          echo "===== OSMOSIS PLUGIN CONFIG ====="
          unzip -p mapsforge-map-writer.jar osmosis-plugins.conf

          echo ""
          echo "===== MAP WRITER CLASSES ====="
          unzip -l mapsforge-map-writer.jar | grep "org/mapsforge/map/writer/osmosis/"

          echo ""
          echo "===== JAR SIZE ====="
          ls -lh mapsforge-map-writer.jar
