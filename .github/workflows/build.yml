name: Build AlHaswa APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== APP BUILD ==="
          cat app/build.gradle
          echo "=== SETTINGS ==="
          cat settings.gradle

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHaswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
