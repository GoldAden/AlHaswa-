name: Build Yemen and World Maps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-maps:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Java 17
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================
      # أدوات النظام
      # =========================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip osmium-tool


      # =========================
      # إنشاء المجلدات
      # =========================
      - name: Create directories
        run: |
          mkdir -p map-output
          mkdir -p app/src/main/assets


      # ==================================================
      #                 YEMEN MAP
      # ==================================================

      # =========================
      # تحميل بيانات اليمن
      # =========================
      - name: Download Yemen OSM data
        run: |
          wget -O yemen-latest.osm.pbf \
            https://download.geofabrik.de/asia/yemen-latest.osm.pbf


      # =========================
      # تحميل Mapsforge Map Writer
      # =========================
      - name: Download Mapsforge Map Writer
        run: |
          wget -O mapsforge-map-writer-0.25.0.jar \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar


      # =========================
      # التحقق من الـJAR
      # =========================
      - name: Check Map Writer
        run: |
          ls -lh mapsforge-map-writer-0.25.0.jar

          jar tf mapsforge-map-writer-0.25.0.jar | grep "OSMMapWriter.class" || true


      # =========================
      # إنشاء Yemen.map
      # =========================
      - name: Build Yemen.map
        run: |
          java -Xmx6g \
            -cp mapsforge-map-writer-0.25.0.jar \
            org.mapsforge.map.writer.OSMMapWriter \
            --map-file=yemen-latest.osm.pbf \
            --output-dir=map-output \
            --map-start-position=15.5527,48.5164 \
            --map-start-zoom=6 \
            --preferred-language=ar


      # =========================
      # التحقق من Yemen.map
      # =========================
      - name: Check Yemen.map
        run: |
          echo "=== YEMEN MAP ==="

          ls -lh map-output/

          if [ ! -f map-output/Yemen.map ]; then
            echo "ERROR: Yemen.map was not created."
            exit 1
          fi

          echo "Yemen.map created successfully."


      # ==================================================
      #                 WORLD MAP
      # ==================================================

      # =========================
      # تحميل World.map
      # =========================
      - name: Download World.map
        run: |
          wget -O map-output/world.map \
            https://download.mapsforge.org/maps/v5/world.map


      # =========================
      # التحقق من World.map
      # =========================
      - name: Check world.map
        run: |
          if [ ! -f map-output/world.map ]; then
            echo "ERROR: world.map was not downloaded."
            exit 1
          fi

          echo "World.map created/downloaded successfully."
          ls -lh map-output/world.map


      # ==================================================
      #       نسخ الخرائط إلى التطبيق
      # ==================================================

      - name: Copy maps to Android assets
        run: |
          cp map-output/Yemen.map \
            app/src/main/assets/Yemen.map

          cp map-output/world.map \
            app/src/main/assets/world.map


      # =========================
      # التحقق النهائي
      # =========================
      - name: Verify Android assets
        run: |
          echo "================================"
          echo "MAP FILES IN ANDROID ASSETS"
          echo "================================"

          ls -lh app/src/main/assets/Yemen.map
          ls -lh app/src/main/assets/world.map

          echo ""
          echo "Maps installed successfully."


      # =========================
      # رفع الخرائط كـ Artifact
      # =========================
      - name: Upload maps
        uses: actions/upload-artifact@v4
        with:
          name: AlHaswa-Maps
          path: |
            app/src/main/assets/Yemen.map
            app/src/main/assets/world.map
          compression-level: 0


      # =========================
      # حفظ الخرائط في المستودع
      # =========================
      - name: Commit maps to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/Yemen.map
          git add app/src/main/assets/world.map

          if git diff --cached --quiet; then
            echo "No map changes to commit."
          else
            git commit -m "Update Yemen and World Maps"
            git push
          fi
