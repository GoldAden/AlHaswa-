name: Generate World Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-map:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. تحميل المشروع
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 3. الأدوات المطلوبة
      # =========================================================
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            unzip \
            osmium-tool \
            gdal-bin \
            python3

          echo "Tools installed successfully."


      # =========================================================
      # 4. تحميل Osmosis
      # =========================================================
      - name: Download Osmosis
        run: |
          set -euo pipefail

          wget -q --show-progress \
            https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip \
            -O osmosis.zip

          test -s osmosis.zip

          rm -rf osmosis

          unzip -q osmosis.zip -d osmosis

          echo "Osmosis files:"
          find osmosis -maxdepth 4 -type f | head -100


      # =========================================================
      # 5. تحميل Mapsforge Map Writer 0.25.0
      # =========================================================
      - name: Download Mapsforge Map Writer
        run: |
          set -euo pipefail

          mkdir -p writer

          wget -q --show-progress \
            https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar \
            -O writer/mapsforge-map-writer.jar

          test -s writer/mapsforge-map-writer.jar

          ls -lh writer/mapsforge-map-writer.jar


      # =========================================================
      # 6. تثبيت Mapsforge plugin
      # =========================================================
      - name: Install Mapsforge plugin
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.openstreetmap/osmosis/plugins"

          cp writer/mapsforge-map-writer.jar \
            "$HOME/.openstreetmap/osmosis/plugins/"

          echo "Mapsforge plugin installed."

          ls -lh "$HOME/.openstreetmap/osmosis/plugins/"


      # =========================================================
      # 7. تحميل Natural Earth
      # =========================================================
      - name: Download Natural Earth data
        run: |
          set -euo pipefail

          mkdir -p data/ne
          mkdir -p data/world
          mkdir -p app/src/main/assets

          echo "Downloading land..."

          wget -q --show-progress \
            https://naturalearth.s3.amazonaws.com/110m_physical/ne_110m_land.zip \
            -O data/ne/land.zip

          echo "Downloading countries..."

          wget -q --show-progress \
            https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.zip \
            -O data/ne/countries.zip

          echo "Downloading cities..."

          wget -q --show-progress \
            https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_populated_places.zip \
            -O data/ne/cities.zip

          test -s data/ne/land.zip
          test -s data/ne/countries.zip
          test -s data/ne/cities.zip

          mkdir -p data/ne/land
          mkdir -p data/ne/countries
          mkdir -p data/ne/cities

          unzip -q data/ne/land.zip -d data/ne/land
          unzip -q data/ne/countries.zip -d data/ne/countries
          unzip -q data/ne/cities.zip -d data/ne/cities

          echo "Natural Earth data downloaded."


      # =========================================================
      # 8. تحويل Natural Earth إلى GeoJSON
      # =========================================================
      - name: Convert Natural Earth to GeoJSON
        run: |
          set -euo pipefail

          ogr2ogr \
            -f GeoJSON \
            data/world/land.geojson \
            data/ne/land/ne_110m_land.shp

          ogr2ogr \
            -f GeoJSON \
            data/world/countries.geojson \
            data/ne/countries/ne_110m_admin_0_countries.shp

          ogr2ogr \
            -f GeoJSON \
            data/world/cities.geojson \
            data/ne/cities/ne_110m_populated_places.shp

          test -s data/world/land.geojson
          test -s data/world/countries.geojson
          test -s data/world/cities.geojson

          ls -lh data/world/*.geojson


      # =========================================================
      # 9. إنشاء OSM XML
      # =========================================================
      - name: Convert GeoJSON to OSM XML
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import math
          import html

          land = json.load(
              open("data/world/land.geojson", encoding="utf-8")
          )

          countries = json.load(
              open("data/world/countries.geojson", encoding="utf-8")
          )

          cities = json.load(
              open("data/world/cities.geojson", encoding="utf-8")
          )

          node_id = 1
          way_id = -1

          nodes = []
          ways = []


          def clean(value):
              if value is None:
                  return ""

              return html.escape(
                  str(value),
                  quote=True
              )


          def add_node(lon, lat, tags=None):
              global node_id

              try:
                  lon = float(lon)
                  lat = float(lat)
              except Exception:
                  return None

              if not math.isfinite(lon):
                  return None

              if not math.isfinite(lat):
                  return None

              if lon < -180 or lon > 180:
                  return None

              if lat < -90 or lat > 90:
                  return None

              nid = node_id
              node_id += 1

              nodes.append(
                  (
                      nid,
                      lat,
                      lon,
                      tags or {}
                  )
              )

              return nid


          def add_polygon(coords, tags):
              global way_id

              if not coords:
                  return

              refs = []

              for point in coords:

                  if len(point) < 2:
                      continue

                  lon = point[0]
                  lat = point[1]

                  nid = add_node(lon, lat)

                  if nid is not None:
                      refs.append(nid)

              if len(refs) < 3:
                  return

              if refs[0] != refs[-1]:
                  refs.append(refs[0])

              wid = way_id
              way_id -= 1

              ways.append(
                  (
                      wid,
                      refs,
                      tags
                  )
              )


          def process_geometry(geometry, tags):
              if not geometry:
                  return

              gtype = geometry.get("type")
              coordinates = geometry.get("coordinates")

              if not coordinates:
                  return

              if gtype == "Polygon":

                  for ring in coordinates:

                      add_polygon(
                          ring,
                          tags
                      )

              elif gtype == "MultiPolygon":

                  for polygon in coordinates:

                      for ring in polygon:

                          add_polygon(
                              ring,
                              tags
                          )


          # =====================================================
          # اليابسة
          # =====================================================

          for feature in land.get("features", []):

              process_geometry(
                  feature.get("geometry"),
                  {
                      "natural": "nosea"
                  }
              )


          # =====================================================
          # حدود الدول
          # =====================================================

          for feature in countries.get("features", []):

              properties = feature.get(
                  "properties",
                  {}
              )

              name = (
                  properties.get("NAME")
                  or properties.get("ADMIN")
                  or properties.get("NAME_EN")
                  or ""
              )

              tags = {
                  "boundary": "administrative",
                  "admin_level": "2"
              }

              if name:
                  tags["name"] = name

              process_geometry(
                  feature.get("geometry"),
                  tags
              )

              # نقطة اسم الدولة
              lon = properties.get("LABEL_X")
              lat = properties.get("LABEL_Y")

              if lon is not None and lat is not None:

                  add_node(
                      lon,
                      lat,
                      {
                          "place": "country",
                          "name": name
                      }
                  )


          # =====================================================
          # المدن
          # =====================================================

          for feature in cities.get("features", []):

              properties = feature.get(
                  "properties",
                  {}
              )

              name = (
                  properties.get("NAME")
                  or properties.get("NAMEASCII")
                  or ""
              )

              geometry = feature.get("geometry")

              if not geometry:
                  continue

              if geometry.get("type") != "Point":
                  continue

              coordinates = geometry.get(
                  "coordinates"
              )

              if not coordinates:
                  continue

              lon = coordinates[0]
              lat = coordinates[1]

              add_node(
                  lon,
                  lat,
                  {
                      "place": "city",
                      "name": name
                  }
              )


          # =====================================================
          # كتابة OSM XML
          # =====================================================

          with open(
              "data/world/world.osm",
              "w",
              encoding="utf-8"
          ) as out:

              out.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              out.write(
                  '<osm version="0.6" generator="AlHaswa">\n'
              )

              for nid, lat, lon, tags in nodes:

                  out.write(
                      f'  <node id="{nid}" '
                      f'lat="{lat:.7f}" '
                      f'lon="{lon:.7f}">\n'
                  )

                  for key, value in tags.items():

                      if value == "":
                          continue

                      out.write(
                          f'    <tag k="{clean(key)}" '
                          f'v="{clean(value)}"/>\n'
                      )

                  out.write(
                      '  </node>\n'
                  )


              for wid, refs, tags in ways:

                  out.write(
                      f'  <way id="{wid}">\n'
                  )

                  for ref in refs:

                      out.write(
                          f'    <nd ref="{ref}"/>\n'
                      )

                  for key, value in tags.items():

                      if value == "":
                          continue

                      out.write(
                          f'    <tag k="{clean(key)}" '
                          f'v="{clean(value)}"/>\n'
                      )

                  out.write(
                      '  </way>\n'
                  )


              out.write(
                  '</osm>\n'
              )


          print()
          print("================================")
          print("World OSM generation completed")
          print("Nodes:", len(nodes))
          print("Ways :", len(ways))
          print("================================")

          PY

          test -s data/world/world.osm

          ls -lh data/world/world.osm


      # =========================================================
      # 10. تحويل OSM XML إلى PBF
      # =========================================================
      - name: Convert OSM XML to PBF
        run: |
          set -euo pipefail

          osmium cat \
            data/world/world.osm \
            -o data/world/world-unsorted.osm.pbf \
            --overwrite

          test -s data/world/world-unsorted.osm.pbf

          ls -lh data/world/world-unsorted.osm.pbf


      # =========================================================
      # 11. ترتيب PBF
      # =========================================================
      - name: Sort PBF
        run: |
          set -euo pipefail

          osmium sort \
            data/world/world-unsorted.osm.pbf \
            -o data/world/world.osm.pbf \
            --overwrite

          test -s data/world/world.osm.pbf

          echo "Sorted world PBF:"

          ls -lh data/world/world.osm.pbf

          echo "PBF information:"

          osmium fileinfo \
            data/world/world.osm.pbf


      # =========================================================
      # 12. العثور على Osmosis
      # =========================================================
      - name: Find Osmosis
        run: |
          set -euo pipefail

          echo "Searching for Osmosis executable..."

          OSMOSIS_BIN=$(find osmosis \
            -type f \
            -name "osmosis" \
            | head -n 1)

          if [ -z "$OSMOSIS_BIN" ]; then

            echo "ERROR: Osmosis executable not found."

            echo ""
            echo "Files inside osmosis:"

            find osmosis \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          echo "Osmosis found at:"
          echo "$OSMOSIS_BIN"

          chmod +x "$OSMOSIS_BIN"

          echo "OSMOSIS_BIN=$OSMOSIS_BIN" \
            >> "$GITHUB_ENV"


      # =========================================================
      # 13. تثبيت Plugin بجانب Osmosis
      # =========================================================
      - name: Install plugin beside Osmosis
        run: |
          set -euo pipefail

          OSMOSIS_DIR=$(dirname "$OSMOSIS_BIN")

          mkdir -p "$OSMOSIS_DIR/plugins"

          cp writer/mapsforge-map-writer.jar \
            "$OSMOSIS_DIR/plugins/"

          echo "Plugin installed at:"

          ls -lh \
            "$OSMOSIS_DIR/plugins/"


      # =========================================================
      # 14. إنشاء world.map
      # =========================================================
      - name: Generate world.map
        run: |
          set -euo pipefail

          echo "Starting Mapsforge map generation..."

          echo "Using Osmosis:"
          echo "$OSMOSIS_BIN"

          rm -f app/src/main/assets/world.map

          "$OSMOSIS_BIN" \
            --read-pbf \
            file=data/world/world.osm.pbf \
            --mapfile-writer \
            file=app/src/main/assets/world.map \
            type=ram \
            zoom-interval=0,0,7 \
            map-start-position=15.0,48.0 \
            map-start-zoom=2

          test -s app/src/main/assets/world.map

          echo ""
          echo "================================"
          echo "world.map generated successfully"
          echo "================================"

          ls -lh \
            app/src/main/assets/world.map


      # =========================================================
      # 15. التحقق النهائي
      # =========================================================
      - name: Verify world.map
        run: |
          set -euo pipefail

          FILE="app/src/main/assets/world.map"

          if [ ! -f "$FILE" ]; then

            echo "ERROR: world.map does not exist."

            exit 1

          fi

          SIZE=$(stat -c%s "$FILE")

          echo "world.map size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 51200 ]; then

            echo "ERROR: world.map is smaller than 50 KB."

            exit 1

          fi

          echo ""
          echo "world.map verification passed."


      # =========================================================
      # 16. رفع world.map إلى المستودع
      # =========================================================
      - name: Commit world.map
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/assets/world.map

          if git diff --cached --quiet; then

            echo "world.map has no changes."

          else

            git commit \
              -m "Add world Mapsforge map"

            git push

          fi


      # =========================================================
      # 17. Artifact احتياطي
      # =========================================================
      - name: Upload world.map artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-map
          path: app/src/main/assets/world.map
          if-no-files-found: error
