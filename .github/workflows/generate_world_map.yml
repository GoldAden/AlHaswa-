name: Generate World Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-map:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1 — Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2 — Java 21
      # ============================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================
      # 3 — Install tools
      # ============================================
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            wget \
            unzip \
            osmium-tool \
            gdal-bin \
            python3

          # --- Osmosis ---
          wget -O osmosis.zip \
            "https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip"

          unzip -q osmosis.zip
          mv osmosis-0.49.2 osmosis
          chmod +x osmosis/bin/osmosis

          echo "=== Osmosis version ==="
          ./osmosis/bin/osmosis --version || true

          echo "=== Osmium version ==="
          osmium --version

      # ============================================
      # 4 — Download Mapsforge Map Writer
      # ============================================
      - name: Download Mapsforge Map Writer
        run: |
          wget -O mapsforge-map-writer.jar \
            "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"

          echo "=== Mapsforge Writer ==="
          ls -lh mapsforge-map-writer.jar

          echo "=== Checking plugin.xml ==="
          unzip -l mapsforge-map-writer.jar | grep -i "plugin.xml" || true

      # ============================================
      # 5 — Install Mapsforge plugin
      # ============================================
      - name: Install Mapsforge plugin
        run: |
          set -euo pipefail

          mkdir -p ~/.openstreetmap/osmosis/plugins
          mkdir -p osmosis/bin/plugins

          cp mapsforge-map-writer.jar \
            ~/.openstreetmap/osmosis/plugins/
          cp mapsforge-map-writer.jar \
            osmosis/bin/plugins/

          echo "=== User plugin directory ==="
          ls -lh ~/.openstreetmap/osmosis/plugins/

          echo "=== Osmosis plugin directory ==="
          ls -lh osmosis/bin/plugins/

      # ============================================
      # 6 — Test Mapsforge task
      # ============================================
      - name: Test Mapsforge task
        run: |
          ./osmosis/bin/osmosis \
            --help | grep -i "mapfile-writer" || true

      # ============================================
      # 7 — Download Natural Earth data
      # ============================================
      - name: Download Natural Earth data
        run: |
          set -euo pipefail

          mkdir -p data/ne
          mkdir -p data/world
          mkdir -p app/src/main/assets

          wget -O data/ne/land.zip \
            "https://naturalearth.s3.amazonaws.com/110m_physical/ne_110m_land.zip"

          wget -O data/ne/countries.zip \
            "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.zip"

          wget -O data/ne/cities.zip \
            "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_populated_places.zip"

          test -s data/ne/land.zip
          test -s data/ne/countries.zip
          test -s data/ne/cities.zip

          unzip -q data/ne/land.zip -d data/ne/land
          unzip -q data/ne/countries.zip -d data/ne/countries
          unzip -q data/ne/cities.zip -d data/ne/cities

      # ============================================
      # 8 — Convert Natural Earth to OSM XML
      # ============================================
      - name: Convert Natural Earth to OSM XML
        run: |
          set -euo pipefail

          ogr2ogr \
            -f GeoJSON \
            data/world/land.geojson \
            data/ne/land/ne_110m_land.shp

          ogr2ogr \
            -f GeoJSON \
            data/world/countries.geojson \
            data/ne/countries/ne_110m_admin_0_countries.shp

          ogr2ogr \
            -f GeoJSON \
            data/world/cities.geojson \
            data/ne/cities/ne_110m_populated_places.shp

          python3 <<'PY'
          import json
          import math
          import sys

          land = json.load(open("data/world/land.geojson", encoding="utf-8"))
          countries = json.load(open("data/world/countries.geojson", encoding="utf-8"))
          cities = json.load(open("data/world/cities.geojson", encoding="utf-8"))

          node_id = 1
          way_id = -1

          nodes = []
          ways = []

          def add_node(lon, lat, tags=None):
              global node_id
              if not math.isfinite(lon) or not math.isfinite(lat):
                  return None
              nid = node_id
              node_id += 1
              nodes.append((nid, lat, lon, tags or {}))
              return nid

          def add_polygon(coords, tags):
              global way_id
              if len(coords) < 3:
                  return
              refs = []
              for lon, lat in coords:
                  nid = add_node(lon, lat)
                  if nid is not None:
                      refs.append(nid)
              if len(refs) < 3:
                  return
              if refs[0] != refs[-1]:
                  refs.append(refs[0])
              wid = way_id
              way_id -= 1
              ways.append((wid, refs, tags))

          def process_geometry(geometry, tags):
              if not geometry:
                  return
              gtype = geometry["type"]
              coordinates = geometry["coordinates"]
              if gtype == "Polygon":
                  for ring in coordinates:
                      add_polygon(ring, tags)
              elif gtype == "MultiPolygon":
                  for polygon in coordinates:
                      for ring in polygon:
                          add_polygon(ring, tags)

          # ===== اليابسة (land) =====
          for feature in land["features"]:
              process_geometry(feature["geometry"], {"natural": "nosea"})

          # ===== البحر (sea) — مضلع يغطي العالم كله =====
          sea_refs = []
          for lon, lat in [
              (-180, -90), (180, -90), (180, 90), (-180, 90), (-180, -90)
          ]:
              nid = add_node(lon, lat)
              if nid is not None:
                  sea_refs.append(nid)
          ways.append((way_id, sea_refs, {"natural": "sea"}))
          way_id -= 1

          # ===== حدود الدول =====
          for feature in countries["features"]:
              props = feature.get("properties", {})
              name = props.get("NAME", props.get("name", ""))
              tags = {
                  "boundary": "administrative",
                  "admin_level": "2"
              }
              if name:
                  tags["name"] = name
              process_geometry(feature["geometry"], tags)

          # ===== المدن الكبرى =====
          for feature in cities["features"]:
              props = feature.get("properties", {})
              name = props.get("NAME", props.get("name", ""))
              geom = feature["geometry"]
              if geom["type"] == "Point":
                  lon, lat = geom["coordinates"]
                  tags = {"place": "city"}
                  if name:
                      tags["name"] = name
                  add_node(lon, lat, tags)

          # ===== كتابة ملف OSM XML =====
          out = open("data/world/world.osm", "w", encoding="utf-8")
          out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
          out.write('<osm version="0.6" generator="natural-earth-to-osm">\n')
          # ===== إضافة bounds — ضروري لـ Mapsforge Map Writer =====
          out.write('  <bounds minlat="-90.0" minlon="-180.0" maxlat="90.0" maxlon="180.0"/>\n')

          for nid, lat, lon, tags in nodes:
              out.write(f'  <node id="{nid}" lat="{lat:.7f}" lon="{lon:.7f}" visible="true">\n')
              for k, v in tags.items():
                  out.write(f'    <tag k="{k}" v="{v}"/>\n')
              out.write('  </node>\n')

          for wid, refs, tags in ways:
              out.write(f'  <way id="{wid}" visible="true">\n')
              for ref in refs:
                  out.write(f'    <nd ref="{ref}"/>\n')
              for k, v in tags.items():
                  out.write(f'    <tag k="{k}" v="{v}"/>\n')
              out.write('  </way>\n')

          out.write('</osm>\n')
          out.close()

          print(f"Nodes: {len(nodes)}, Ways: {len(ways)}")
          print("Done writing world.osm")
          PY

      # ============================================
      # 9 — Convert OSM XML to PBF
      # ============================================
      - name: Convert OSM XML to PBF
        run: |
          set -euo pipefail

          osmium cat data/world/world.osm \
            -o data/world/world.osm.pbf

          echo "=== PBF file info ==="
          osmium fileinfo data/world/world.osm.pbf

          ls -lh data/world/world.osm.pbf

      # ============================================
      # 10 — Remove maritime boundaries (safety)
      # ============================================
      - name: Remove maritime boundaries
        run: |
          set -euo pipefail

          # Natural Earth لا يحتوي maritime لكن نفلتر احتياطياً
          osmium tags-filter \
            data/world/world.osm.pbf \
            'r/boundary=maritime' 'r/maritime=yes' \
            --invert-match \
            -o data/world/world-filtered.osm.pbf \
            --overwrite

          # إعادة ترتيب + حساب bbox تلقائي
          osmium sort \
            data/world/world-filtered.osm.pbf \
            -o data/world/world-clean.osm.pbf \
            --overwrite

          echo "=== Clean PBF file info ==="
          osmium fileinfo data/world/world-clean.osm.pbf

          ls -lh data/world/world-clean.osm.pbf

      # ============================================
      # 11 — Generate world.map
      # ============================================
      - name: Generate world.map
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          ./osmosis/bin/osmosis \
            --read-pbf file=data/world/world-clean.osm.pbf \
            --mapfile-writer \
            file=app/src/main/assets/world.map \
            type=ram \
            zoom-interval-conf=5,0,7 \
            bbox=-90.0,-180.0,90.0,180.0 \
            map-start-position=15.0,48.0 \
            map-start-zoom=2

          echo "=== Generated map ==="
          ls -lh app/src/main/assets/world.map

      # ============================================
      # 12 — Verify map
      # ============================================
      - name: Verify map
        run: |
          set -euo pipefail

          FILE="app/src/main/assets/world.map"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: world.map is missing or empty!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          if [ "$SIZE" -lt 51200 ]; then
            echo "ERROR: world.map is only $SIZE bytes!"
            exit 1
          fi

          echo "======================================"
          echo "✅ world.map created successfully"
          echo "Size: $(ls -lh "$FILE" | awk '{print $5}')"
          echo "Bytes: $SIZE"
          echo "======================================"

      # ============================================
      # 13 — Commit map
      # ============================================
      - name: Commit map
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add app/src/main/assets/world.map

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: generate world Mapsforge map [skip ci]"
            git push
          fi
