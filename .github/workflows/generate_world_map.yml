name: Generate World Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-map:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1 — Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2 — Java 21
      # ============================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ============================================
      # 3 — Install tools
      # ============================================
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            wget \
            unzip \
            osmium-tool \
            gdal-bin \
            python3 \
            python3-gdal

          # --- Osmosis ---
          wget -O osmosis.zip \
            "https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip"

          mkdir -p osmosis-tmp
          unzip -q osmosis.zip -d osmosis-tmp
          mv osmosis-tmp/osmosis-0.49.2 osmosis
          chmod +x osmosis/bin/osmosis

          echo "=== Osmosis version ==="
          ./osmosis/bin/osmosis --version || true

          echo "=== Osmium version ==="
          osmium --version

      # ============================================
      # 4 — Download Mapsforge Map Writer + Install
      # ============================================
      - name: Download and install Mapsforge Map Writer
        run: |
          set -euo pipefail

          wget -O mapsforge-map-writer.jar \
            "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"

          mkdir -p ~/.openstreetmap/osmosis/plugins
          mkdir -p osmosis/lib/plugins
          mkdir -p osmosis/bin/plugins

          cp mapsforge-map-writer.jar ~/.openstreetmap/osmosis/plugins/
          cp mapsforge-map-writer.jar osmosis/lib/plugins/
          cp mapsforge-map-writer.jar osmosis/bin/plugins/

          echo "=== Plugin installed ==="
          ls -lh ~/.openstreetmap/osmosis/plugins/

          ./osmosis/bin/osmosis --help | grep -i "mapfile-writer" || true

      # ============================================
      # 5 — Download land polygons from OSM Data
      # ============================================
      - name: Download land polygons
        run: |
          set -euo pipefail

          mkdir -p data

          echo "Downloading land polygons..."
          wget -O data/land-polygons-split-4326.zip \
            "https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip"

          echo "Unzipping land polygons..."
          unzip -q data/land-polygons-split-4326.zip -d data/

          echo "=== Land polygons ==="
          ls -lh data/land-polygons-split-4326/land_polygons.shp

      # ============================================
      # 6 — Convert land shapefile to OSM XML
      # ============================================
      - name: Convert land polygons to OSM XML
        run: |
          set -euo pipefail

          mkdir -p data/world

          # ogr2ogr يحول Shapefile إلى GeoJSON
          ogr2ogr \
            -f GeoJSON \
            -lco COORDINATE_PRECISION=2 \
            data/world/land.geojson \
            data/land-polygons-split-4326/land_polygons.shp

          echo "=== land.geojson ==="
          ls -lh data/world/land.geojson

          # تحويل GeoJSON إلى OSM XML بـ Python
          # كل ميزة تصبح way بـ tag natural=nosea
          python3 << 'PY'
          import json
          import math

          node_id = 500000001
          way_id = -500000001

          with open("data/world/land.geojson", encoding="utf-8") as f:
              land = json.load(f)

          out = open("data/world/land.osm", "w", encoding="utf-8")
          out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
          out.write('<osm version="0.6" generator="land-to-osm">\n')
          out.write('  <bounds minlat="-90.0" minlon="-180.0" maxlat="90.0" maxlon="180.0"/>\n')

          def add_ring(coords, tags):
              """إضافة حلقة واحدة (ring) كـ way"""
              global node_id, way_id
              if not coords or len(coords) < 3:
                  return
              refs = []
              for point in coords:
                  # coords قد تكون [lon, lat] أو [lon, lat, z]
                  if not isinstance(point, (list, tuple)) or len(point) < 2:
                      continue
                  lon, lat = point[0], point[1]
                  if math.isfinite(lon) and math.isfinite(lat) and abs(lon) <= 180 and abs(lat) <= 90:
                      out.write(f'  <node id="{node_id}" lat="{lat:.7f}" lon="{lon:.7f}"/>\n')
                      refs.append(node_id)
                      node_id += 1
              if len(refs) < 3:
                  return
              if refs[0] != refs[-1]:
                  refs.append(refs[0])
              out.write(f'  <way id="{way_id}">\n')
              for ref in refs:
                  out.write(f'    <nd ref="{ref}"/>\n')
              for k, v in tags.items():
                  out.write(f'    <tag k="{k}" v="{v}"/>\n')
              out.write('  </way>\n')
              way_id -= 1

          def process_geometry(geom, tags):
              """معالجة أي نوع هندسة بأمان"""
              if not geom or not isinstance(geom, dict):
                  return
              gtype = geom.get("type", "")
              coords = geom.get("coordinates")
              if coords is None:
                  return
              try:
                  if gtype == "Polygon":
                      for ring in coords:
                          if isinstance(ring, list) and len(ring) > 0:
                              add_ring(ring, tags)
                  elif gtype == "MultiPolygon":
                      for polygon in coords:
                          if isinstance(polygon, list):
                              for ring in polygon:
                                  if isinstance(ring, list) and len(ring) > 0:
                                      add_ring(ring, tags)
                  elif gtype == "GeometryCollection":
                      for sub_geom in geom.get("geometries", []):
                          process_geometry(sub_geom, tags)
              except Exception as e:
                  print(f"  Warning: skipping geometry ({gtype}): {e}")

          count = 0
          for feature in land.get("features", []):
              geom = feature.get("geometry")
              if geom:
                  process_geometry(geom, {"natural": "nosea"})
                  count += 1
              if count % 1000 == 0 and count > 0:
                  print(f"  Processed {count} land features...")

          out.write('</osm>\n')
          out.close()
          print(f"Done: land.osm ({count} features)")
          PY

          echo "=== land.osm ==="
          ls -lh data/world/land.osm

      # ============================================
      # 7 — Create sea.osm
      # ============================================
      - name: Create sea polygon
        run: |
          cat > data/world/sea.osm << 'SEA'
          <?xml version="1.0" encoding="UTF-8"?>
          <osm version="0.6" generator="sea-polygon">
            <bounds minlat="-90.0" minlon="-180.0" maxlat="90.0" maxlon="180.0"/>
            <node id="1" lat="-90.0" lon="-180.0"/>
            <node id="2" lat="-90.0" lon="180.0"/>
            <node id="3" lat="90.0" lon="180.0"/>
            <node id="4" lat="90.0" lon="-180.0"/>
            <way id="-1">
              <nd ref="1"/>
              <nd ref="2"/>
              <nd ref="3"/>
              <nd ref="4"/>
              <nd ref="1"/>
              <tag k="natural" v="sea"/>
            </way>
          </osm>
          SEA

          echo "=== sea.osm ==="
          ls -lh data/world/sea.osm

      # ============================================
      # 8 — Download Natural Earth boundaries and cities
      # ============================================
      - name: Download Natural Earth data
        run: |
          set -euo pipefail

          mkdir -p data/ne

          wget -O data/ne/countries.zip \
            "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.zip"

          wget -O data/ne/cities.zip \
            "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_populated_places.zip"

          unzip -q data/ne/countries.zip -d data/ne/countries
          unzip -q data/ne/cities.zip -d data/ne/cities

      # ============================================
      # 9 — Convert boundaries and cities to OSM XML
      # ============================================
      - name: Convert boundaries and cities to OSM
        run: |
          set -euo pipefail

          ogr2ogr -f GeoJSON data/ne/countries.geojson data/ne/countries/ne_110m_admin_0_countries.shp
          ogr2ogr -f GeoJSON data/ne/cities.geojson data/ne/cities/ne_110m_populated_places.shp

          python3 << 'PY'
          import json
          import math

          node_id = 100000001
          way_id = -100000001

          with open("data/ne/countries.geojson", encoding="utf-8") as f:
              countries = json.load(f)

          with open("data/ne/cities.geojson", encoding="utf-8") as f:
              cities = json.load(f)

          out = open("data/world/boundaries.osm", "w", encoding="utf-8")
          out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
          out.write('<osm version="0.6" generator="ne-to-osm">\n')
          out.write('  <bounds minlat="-90.0" minlon="-180.0" maxlat="90.0" maxlon="180.0"/>\n')

          def add_ring(coords, tags):
              """إضافة حلقة واحدة (ring) كـ way"""
              global node_id, way_id
              if not coords or len(coords) < 3:
                  return
              refs = []
              for point in coords:
                  if not isinstance(point, (list, tuple)) or len(point) < 2:
                      continue
                  lon, lat = point[0], point[1]
                  if math.isfinite(lon) and math.isfinite(lat) and abs(lon) <= 180 and abs(lat) <= 90:
                      out.write(f'  <node id="{node_id}" lat="{lat:.7f}" lon="{lon:.7f}"/>\n')
                      refs.append(node_id)
                      node_id += 1
              if len(refs) < 3:
                  return
              if refs[0] != refs[-1]:
                  refs.append(refs[0])
              out.write(f'  <way id="{way_id}">\n')
              for ref in refs:
                  out.write(f'    <nd ref="{ref}"/>\n')
              for k, v in tags.items():
                  out.write(f'    <tag k="{k}" v="{v}"/>\n')
              out.write('  </way>\n')
              way_id -= 1

          def process_geometry(geom, tags):
              """معالجة أي نوع هندسة بأمان"""
              if not geom or not isinstance(geom, dict):
                  return
              gtype = geom.get("type", "")
              coords = geom.get("coordinates")
              if coords is None:
                  return
              try:
                  if gtype == "Polygon":
                      for ring in coords:
                          if isinstance(ring, list) and len(ring) > 0:
                              add_ring(ring, tags)
                  elif gtype == "MultiPolygon":
                      for polygon in coords:
                          if isinstance(polygon, list):
                              for ring in polygon:
                                  if isinstance(ring, list) and len(ring) > 0:
                                      add_ring(ring, tags)
                  elif gtype == "GeometryCollection":
                      for sub_geom in geom.get("geometries", []):
                          process_geometry(sub_geom, tags)
              except Exception as e:
                  print(f"  Warning: skipping geometry ({gtype}): {e}")

          # === حدود الدول ===
          for feature in countries.get("features", []):
              props = feature.get("properties", {})
              name = props.get("NAME", props.get("name", ""))
              tags = {"boundary": "administrative", "admin_level": "2"}
              if name:
                  tags["name"] = name
              geom = feature.get("geometry")
              if geom:
                  process_geometry(geom, tags)

          # === المدن الكبرى ===
          for feature in cities.get("features", []):
              props = feature.get("properties", {})
              name = props.get("NAME", props.get("name", ""))
              geom = feature.get("geometry")
              if not geom or not isinstance(geom, dict):
                  continue
              if geom.get("type") == "Point":
                  coords = geom.get("coordinates")
                  if coords and len(coords) >= 2:
                      lon, lat = coords[0], coords[1]
                      if math.isfinite(lon) and math.isfinite(lat):
                          tags = {"place": "city"}
                          if name:
                              tags["name"] = name
                          out.write(f'  <node id="{node_id}" lat="{lat:.7f}" lon="{lon:.7f}">\n')
                          for k, v in tags.items():
                              out.write(f'    <tag k="{k}" v="{v}"/>\n')
                          out.write('  </node>\n')
                          node_id += 1

          out.write('</osm>\n')
          out.close()
          print("Done: boundaries.osm")
          PY

          echo "=== boundaries.osm ==="
          ls -lh data/world/boundaries.osm

      # ============================================
      # 10 — Merge all OSM files into one PBF
      # ============================================
      - name: Merge all files into PBF
        run: |
          set -euo pipefail

          echo "Converting sea.osm to PBF..."
          osmium cat data/world/sea.osm -o data/world/sea.pbf --overwrite

          echo "Converting boundaries.osm to PBF..."
          osmium cat data/world/boundaries.osm -o data/world/boundaries.pbf --overwrite

          echo "Converting land.osm to PBF..."
          osmium cat data/world/land.osm -o data/world/land.pbf --overwrite

          echo "Merging all PBF files..."
          osmium merge \
            data/world/sea.pbf \
            data/world/boundaries.pbf \
            data/world/land.pbf \
            -o data/world/world_merged.pbf \
            --overwrite

          echo "=== world_merged.pbf ==="
          osmium fileinfo data/world/world_merged.pbf
          ls -lh data/world/world_merged.pbf

      # ============================================
      # 11 — Remove maritime boundaries + sort
      # ============================================
      - name: Clean and sort data
        run: |
          set -euo pipefail

          # إزالة الحدود البحرية احتياطياً
          osmium tags-filter \
            data/world/world_merged.pbf \
            'r/boundary=maritime' 'r/maritime=yes' \
            --invert-match \
            -o data/world/world_clean.pbf \
            --overwrite

          # ترتيب + حساب bbox
          osmium sort \
            data/world/world_clean.pbf \
            -o data/world/world_final.pbf \
            --overwrite

          echo "=== world_final.pbf ==="
          osmium fileinfo data/world/world_final.pbf
          ls -lh data/world/world_final.pbf

      # ============================================
      # 12 — Generate world.map
      # ============================================
      - name: Generate world.map
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          # زيادة ذاكرة Java لأن بيانات العالم كبيرة
          export JAVACMD_OPTIONS="-Xmx4g"

          ./osmosis/bin/osmosis \
            --read-pbf file=data/world/world_final.pbf \
            --mapfile-writer \
            file=app/src/main/assets/world.map \
            type=ram \
            zoom-interval-conf=5,0,7 \
            bbox=-90.0,-180.0,90.0,180.0 \
            map-start-position=15.0,48.0 \
            map-start-zoom=2 \
            progress-logs=true \
            tag-values=true

          echo "=== Generated world.map ==="
          ls -lh app/src/main/assets/world.map

      # ============================================
      # 13 — Verify world.map
      # ============================================
      - name: Verify world.map
        run: |
          set -euo pipefail

          FILE="app/src/main/assets/world.map"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: world.map is missing or empty!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          if [ "$SIZE" -lt 512000 ]; then
            echo "WARNING: world.map is only $SIZE bytes (expected > 500KB)"
          fi

          echo "======================================"
          echo "✅ world.map created successfully"
          echo "Size: $(ls -lh "$FILE" | awk '{print $5}')"
          echo "Bytes: $SIZE"
          echo "======================================"

      # ============================================
      # 14 — Commit world.map
      # ============================================
      - name: Commit world.map
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add app/src/main/assets/world.map

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: generate world Mapsforge map (zoom 0-7) [skip ci]"
            git push
          fi
