name: Build AlHaswa Unified Mapsforge Map

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies (Osmium, osmosis, wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool osmosis wget unzip

      - name: Download Map Data (World Boundaries & Yemen)
        run: |
          echo "Downloading Yemen detailed OSM data from Geofabrik..."
          wget -O yemen.osm.pbf "https://download.geofabrik.de/asia/yemen-latest.osm.pbf"

          echo "Downloading World boundaries extract..."
          wget -O world-low.osm.pbf "https://download.geofabrik.de/africa-latest.osm.pbf" || true

      - name: Filter Out Maritime Boundaries & Unwanted Details
        run: |
          echo "Filtering Yemen data to remove maritime boundaries and keep full details..."
          osmium tags-filter yemen.osm.pbf \
            'r/boundary!=maritime' 'w/boundary!=maritime' \
            'r/maritime=yes' 'w/maritime=yes' \
            -o yemen-clean.osm.pbf

          echo "Filtering World data to keep only country boundaries and names..."
          osmium tags-filter world-low.osm.pbf \
            'boundary=administrative' \
            'place=country' \
            'place=state' \
            'natural=coastline' \
            'natural=land' \
            'natural=water' \
            -o world-clean.osm.pbf

          echo "Merging World boundaries and Yemen detailed data into a single PBF..."
          osmosis \
            --read-pbf file="world-clean.osm.pbf" \
            --read-pbf file="yemen-clean.osm.pbf" \
            --merge \
            --write-pbf file="merged-final.osm.pbf"

      - name: Download Mapsforge Map Writer 0.25.0 Standalone Jar
        run: |
          wget -O mapsforge-map-writer.jar \
            "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"

      - name: Generate Mapsforge Vector Map (.map) Directly
        run: |
          echo "Converting merged PBF to Mapsforge 0.25.0 vector format..."
          java -jar mapsforge-map-writer.jar \
            file="merged-final.osm.pbf" \
            out="AlHaswa.map"

      - name: Place Map into Android Assets Directory
        run: |
          mkdir -p app/src/main/assets
          mv AlHaswa.map app/src/main/assets/AlHaswa.map
          ls -lh app/src/main/assets/AlHaswa.map

      - name: Commit and Push Generated Map to Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add app/src/main/assets/AlHaswa.map
          git commit -m "chore: auto-generate unified AlHaswa.map successfully (v0.25.0)" || echo "No changes to commit"
          git push
