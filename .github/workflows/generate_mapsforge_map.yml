name: Generate AlHaswa Mapsforge Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      #  1 — Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      #  2 — Java 21 (مطلوب لـ Osmosis + Mapsforge Writer)
      # ============================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================
      #  3 — Python 3.11 (مستقل عن نظام Ubuntu)
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================
      #  4 — تثبيت الأدوات
      #   - osmosis من مستودع jammy لأنه حُذف من noble
      #   - نستخدم python/pip من setup-python فقط
      # ============================================
      - name: Install tools
        run: |
          # إضافة مستودع jammy مؤقتاً لتنزيل osmosis
          echo "deb http://archive.ubuntu.com/ubuntu jammy universe" | sudo tee /etc/apt/sources.list.d/jammy.list

          sudo apt-get update -qq

          sudo apt-get install -y wget unzip osmium-tool osmosis

          # حذف مستودع jammy بعد التثبيت
          sudo rm -f /etc/apt/sources.list.d/jammy.list

          # تثبيت pyshp في Python 3.11 فقط
          pip install pyshp

          # التحقق
          echo "=== Verification ==="
          osmosis --version 2>&1 | head -3
          osmium --version
          python -c "import shapefile; print('pyshp OK, path:', shapefile.__file__)"

      # ============================================
      #  5 — تنزيل Natural Earth
      # ============================================
      - name: Download Natural Earth
        run: |
          mkdir -p data/natural-earth

          wget -O data/natural-earth/countries.zip \
            "https://naturalearth.s3.amazonaws.com/10m_cultural/ne_10m_admin_0_countries.zip"

          wget -O data/natural-earth/coastline.zip \
            "https://naturalearth.s3.amazonaws.com/10m_physical/ne_10m_coastline.zip"

          unzip -o data/natural-earth/countries.zip -d data/natural-earth/countries
          unzip -o data/natural-earth/coastline.zip -d data/natural-earth/coastline

      # ============================================
      #  6 — تنزيل اليمن من Geofabrik
      # ============================================
      - name: Download Yemen OSM
        run: |
          mkdir -p data/yemen

          wget -O data/yemen/yemen.osm.pbf \
            "https://download.geofabrik.de/asia/yemen-latest.osm.pbf"

          ls -lh data/yemen/yemen.osm.pbf

      # ============================================
      #  7 — تحويل حدود الدول إلى OSM
      #    (boundary=administrative + admin_level=2 + name)
      # ============================================
      - name: Convert Natural Earth countries to OSM
        run: |
          cat > convert_world.py <<'PY'
          import shapefile
          import xml.etree.ElementTree as ET

          INPUT = "data/natural-earth/countries/ne_10m_admin_0_countries.shp"
          OUTPUT = "data/world-countries.osm"

          sf = shapefile.Reader(INPUT, encoding="utf-8")

          root = ET.Element("osm", {"version": "0.6", "generator": "AlHaswa-NaturalEarth"})

          next_node = -1
          next_way = -1

          def tag(parent, key, value):
              ET.SubElement(parent, "tag", {"k": key, "v": str(value)})

          for record, shape in zip(sf.records(), sf.shapes()):
              fields = sf.fields[1:]
              values = list(record)
              attrs = {fields[i][0]: values[i] for i in range(len(fields))}

              name = attrs.get("NAME") or attrs.get("ADMIN") or attrs.get("SOVEREIGNT") or "Unknown"

              points = shape.points
              parts = list(shape.parts)
              parts.append(len(points))

              for p in range(len(parts) - 1):
                  ring = points[parts[p]:parts[p + 1]]
                  if len(ring) < 3:
                      continue

                  way = ET.SubElement(root, "way", {"id": str(next_way), "version": "1"})
                  next_way -= 1

                  node_ids = []
                  for lon, lat in ring:
                      node = ET.SubElement(root, "node", {"id": str(next_node), "version": "1", "lat": str(lat), "lon": str(lon)})
                      node_ids.append(next_node)
                      next_node -= 1

                  if node_ids[0] != node_ids[-1]:
                      node_ids.append(node_ids[0])

                  for nid in node_ids:
                      ET.SubElement(way, "nd", {"ref": str(nid)})

                  tag(way, "boundary", "administrative")
                  tag(way, "admin_level", "2")
                  tag(way, "name", name)

          ET.ElementTree(root).write(OUTPUT, encoding="utf-8", xml_declaration=True)
          print("Created:", OUTPUT)
          PY

          python convert_world.py
          ls -lh data/world-countries.osm

      # ============================================
      #  8 — تحويل السواحل إلى OSM
      #    (natural=coastline)
      # ============================================
      - name: Convert Natural Earth coastline to OSM
        run: |
          cat > convert_coastline.py <<'PY'
          import shapefile
          import xml.etree.ElementTree as ET

          INPUT = "data/natural-earth/coastline/ne_10m_coastline.shp"
          OUTPUT = "data/world-coastline.osm"

          sf = shapefile.Reader(INPUT)

          root = ET.Element("osm", {"version": "0.6", "generator": "AlHaswa-NaturalEarth"})

          next_node = -100000000
          next_way = -100000000

          for shape in sf.shapes():
              points = shape.points
              if len(points) < 2:
                  continue

              way = ET.SubElement(root, "way", {"id": str(next_way), "version": "1"})
              next_way -= 1

              for lon, lat in points:
                  node = ET.SubElement(root, "node", {"id": str(next_node), "version": "1", "lat": str(lat), "lon": str(lon)})
                  ET.SubElement(way, "nd", {"ref": str(next_node)})
                  next_node -= 1

              ET.SubElement(way, "tag", {"k": "natural", "v": "coastline"})

          ET.ElementTree(root).write(OUTPUT, encoding="utf-8", xml_declaration=True)
          print("Created:", OUTPUT)
          PY

          python convert_coastline.py
          ls -lh data/world-coastline.osm

      # ============================================
      #  9 — تحويل OSM XML إلى PBF
      # ============================================
      - name: Convert world OSM to PBF
        run: |
          osmosis --read-xml file=data/world-countries.osm --write-pbf file=data/world-countries.pbf
          osmosis --read-xml file=data/world-coastline.osm --write-pbf file=data/world-coastline.pbf
          ls -lh data/world-countries.pbf data/world-coastline.pbf

      # ============================================
      #  10 — حذف boundary=maritime من اليمن
      # ============================================
      - name: Remove maritime boundaries from Yemen
        run: |
          osmium tags-filter \
            data/yemen/yemen.osm.pbf \
            'r/boundary=maritime' \
            --invert-match \
            -o data/yemen/yemen-clean.pbf \
            --overwrite
          ls -lh data/yemen/yemen-clean.pbf

      # ============================================
      #  11 — دمج الكل
      # ============================================
      - name: Merge datasets
        run: |
          osmium merge \
            data/world-countries.pbf \
            data/world-coastline.pbf \
            data/yemen/yemen-clean.pbf \
            -o data/AlHaswa-source.pbf \
            --overwrite
          ls -lh data/AlHaswa-source.pbf

      # ============================================
      #  12 — Mapsforge Map Writer 0.25.0
      # ============================================
      - name: Download Mapsforge Map Writer 0.25.0
        run: |
          wget -O mapsforge-map-writer.jar \
            "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"
          ls -lh mapsforge-map-writer.jar

      - name: Install Mapsforge plugin
        run: |
          mkdir -p ~/.openstreetmap/osmosis/plugins
          cp mapsforge-map-writer.jar ~/.openstreetmap/osmosis/plugins/

      # ============================================
      #  13 — إنشاء AlHaswa.map
      # ============================================
      - name: Generate AlHaswa.map
        run: |
          mkdir -p app/src/main/assets

          osmosis \
            --read-pbf file=data/AlHaswa-source.pbf \
            --map-writer \
            file=app/src/main/assets/AlHaswa.map \
            type=ram \
            map-start-position=15.3694,44.1910 \
            map-start-zoom=6

          ls -lh app/src/main/assets/AlHaswa.map

      # ============================================
      #  14 — التحقق
      # ============================================
      - name: Verify map
        run: |
          FILE="app/src/main/assets/AlHaswa.map"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: AlHaswa.map is missing or empty!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: AlHaswa.map is only $SIZE bytes — too small!"
            exit 1
          fi

          echo "======================================"
          echo "AlHaswa.map created successfully"
          echo "Size: $(ls -lh $FILE | awk '{print $5}')"
          echo "======================================"

      # ============================================
      #  15 — حفظ الخريطة في المستودع
      # ============================================
      - name: Commit map
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add app/src/main/assets/AlHaswa.map

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: generate unified AlHaswa map [skip ci]"
            git push
          fi
