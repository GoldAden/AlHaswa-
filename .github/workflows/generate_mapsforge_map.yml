name: Generate AlHaswa Mapsforge Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:

    # ============================================
    # 1 — Checkout
    # ============================================
    - name: Checkout repository
      uses: actions/checkout@v4


    # ============================================
    # 2 — Java 21
    # ============================================
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'


    # ============================================
    # 3 — Install tools
    # ============================================
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget unzip osmium-tool

        wget -O osmosis.zip \
          "https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip"

        unzip -q osmosis.zip

        mv osmosis-0.49.2 osmosis

        chmod +x osmosis/bin/osmosis

        echo "=== Osmosis version ==="
        ./osmosis/bin/osmosis --version || true

        echo "=== Osmium version ==="
        osmium --version


    # ============================================
    # 4 — Download Yemen OSM
    # ============================================
    - name: Download Yemen OSM
      run: |
        mkdir -p data/yemen

        wget -O data/yemen/yemen.osm.pbf \
          "https://download.geofabrik.de/asia/yemen-latest.osm.pbf"

        ls -lh data/yemen/yemen.osm.pbf


    # ============================================
    # 5 — Remove maritime boundaries
    # ============================================
    - name: Remove maritime boundaries
      run: |
        osmium tags-filter \
          data/yemen/yemen.osm.pbf \
          'r/boundary=maritime' \
          --invert-match \
          -o data/yemen/yemen-clean.pbf \
          --overwrite

        ls -lh data/yemen/yemen-clean.pbf


    # ============================================
    # 6 — Download Mapsforge Map Writer
    # ============================================
    - name: Download Mapsforge Map Writer
      run: |
        wget -O mapsforge-map-writer.jar \
          "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"

        echo "=== Mapsforge Writer ==="
        ls -lh mapsforge-map-writer.jar

        echo "=== Checking plugin.xml ==="
        unzip -l mapsforge-map-writer.jar | grep -i "plugin.xml" || true


    # ============================================
    # 7 — Install Mapsforge plugin
    # ============================================
    - name: Install Mapsforge plugin
      run: |
        mkdir -p ~/.openstreetmap/osmosis/plugins
        mkdir -p osmosis/bin/plugins

        cp mapsforge-map-writer.jar \
          ~/.openstreetmap/osmosis/plugins/

        cp mapsforge-map-writer.jar \
          osmosis/bin/plugins/

        echo "=== User plugin directory ==="
        ls -lh ~/.openstreetmap/osmosis/plugins/

        echo "=== Osmosis plugin directory ==="
        ls -lh osmosis/bin/plugins/


    # ============================================
    # 8 — Inspect Mapsforge plugin
    # ============================================
    - name: Inspect Mapsforge plugin
      run: |
        echo "=== Mapsforge plugin.xml ==="

        unzip -p mapsforge-map-writer.jar plugin.xml 2>/dev/null || \
        unzip -p mapsforge-map-writer.jar META-INF/plugin.xml 2>/dev/null || \
        true

        echo "=== Searching for mapfile-writer ==="

        unzip -p mapsforge-map-writer.jar plugin.xml 2>/dev/null | \
          grep -i "mapfile-writer" || true


    # ============================================
    # 9 — Test Mapsforge task
    # ============================================
    - name: Test Mapsforge task
      run: |
        ./osmosis/bin/osmosis \
          --help | grep -i "mapfile-writer" || true


    # ============================================
    # 10 — Generate AlHaswa.map
    # ============================================
    - name: Generate AlHaswa.map
      run: |
        mkdir -p app/src/main/assets

        ./osmosis/bin/osmosis \
          --read-pbf file=data/yemen/yemen-clean.pbf \
          --mapfile-writer \
            file=app/src/main/assets/AlHaswa.map \
            type=ram \
            map-start-position=15.3694,44.1910 \
            map-start-zoom=6

        echo "=== Generated map ==="

        ls -lh app/src/main/assets/AlHaswa.map


    # ============================================
    # 11 — Verify map
    # ============================================
    - name: Verify map
      run: |
        FILE="app/src/main/assets/AlHaswa.map"

        if [ ! -s "$FILE" ]; then
          echo "ERROR: AlHaswa.map is missing or empty!"
          exit 1
        fi

        SIZE=$(stat -c%s "$FILE")

        if [ "$SIZE" -lt 50000 ]; then
          echo "ERROR: AlHaswa.map is only $SIZE bytes!"
          exit 1
        fi

        echo "======================================"
        echo "✅ AlHaswa.map created successfully"
        echo "Size: $(ls -lh "$FILE" | awk '{print $5}')"
        echo "Bytes: $SIZE"
        echo "======================================"


    # ============================================
    # 12 — Commit map
    # ============================================
    - name: Commit map
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

        git add app/src/main/assets/AlHaswa.map

        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: generate AlHaswa Mapsforge map [skip ci]"
          git push
        fi
