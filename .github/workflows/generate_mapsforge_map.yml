name: Generate AlHaswa Mapsforge Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1) جلب المشروع
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2) Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3) Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------
      # 4) الأدوات المطلوبة
      # ---------------------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            osmium-tool \
            osmosis \
            python3-pip

          pip install --upgrade pyshp shapely

      # ---------------------------------------------------------
      # 5) تنزيل Natural Earth
      # ---------------------------------------------------------
      - name: Download Natural Earth
        run: |
          mkdir -p data/natural-earth

          wget -O data/natural-earth/countries.zip \
            "https://naturalearth.s3.amazonaws.com/10m_cultural/ne_10m_admin_0_countries.zip"

          wget -O data/natural-earth/coastline.zip \
            "https://naturalearth.s3.amazonaws.com/10m_physical/ne_10m_coastline.zip"

          unzip -o data/natural-earth/countries.zip \
            -d data/natural-earth/countries

          unzip -o data/natural-earth/coastline.zip \
            -d data/natural-earth/coastline

      # ---------------------------------------------------------
      # 6) تنزيل اليمن التفصيلي من Geofabrik
      # ---------------------------------------------------------
      - name: Download detailed Yemen OSM data
        run: |
          mkdir -p data/yemen

          wget -O data/yemen/yemen.osm.pbf \
            "https://download.geofabrik.de/asia/yemen-latest.osm.pbf"

          ls -lh data/yemen/yemen.osm.pbf

      # ---------------------------------------------------------
      # 7) إنشاء OSM عالمي مبسط من Natural Earth
      #
      # كل دولة:
      #   natural=land
      #   boundary=administrative
      #   admin_level=2
      #   name=اسم الدولة
      #
      # لا يتم إنشاء boundary=maritime.
      # ---------------------------------------------------------
      - name: Convert Natural Earth countries to OSM
        run: |
          cat > convert_world.py <<'PY'
          import shapefile
          import os
          import xml.etree.ElementTree as ET

          INPUT = "data/natural-earth/countries/ne_10m_admin_0_countries.shp"
          OUTPUT = "data/world-countries.osm"

          sf = shapefile.Reader(INPUT, encoding="utf-8")

          root = ET.Element(
              "osm",
              {
                  "version": "0.6",
                  "generator": "AlHaswa-NaturalEarth"
              }
          )

          next_node = -1
          next_way = -1

          def add_tag(parent, key, value):
              ET.SubElement(
                  parent,
                  "tag",
                  {
                      "k": key,
                      "v": str(value)
                  }
              )

          for record, shape in zip(sf.records(), sf.shapes()):

              fields = sf.fields[1:]
              values = list(record)
              attrs = {
                  fields[i][0]: values[i]
                  for i in range(len(fields))
              }

              name = (
                  attrs.get("NAME_AR")
                  or attrs.get("NAME")
                  or attrs.get("ADMIN")
                  or "Unknown"
              )

              points = shape.points
              parts = list(shape.parts)
              parts.append(len(points))

              for p in range(len(parts) - 1):

                  start = parts[p]
                  end = parts[p + 1]

                  ring = points[start:end]

                  if len(ring) < 3:
                      continue

                  way = ET.SubElement(
                      root,
                      "way",
                      {"id": str(next_way)}
                  )

                  next_way -= 1

                  node_ids = []

                  for lon, lat in ring:

                      node = ET.SubElement(
                          root,
                          "node",
                          {
                              "id": str(next_node),
                              "lat": str(lat),
                              "lon": str(lon)
                          }
                      )

                      node_ids.append(next_node)
                      next_node -= 1

                  # إغلاق المضلع
                  for node_id in node_ids:
                      ET.SubElement(
                          way,
                          "nd",
                          {"ref": str(node_id)}
                      )

                  # حدود دولة برية
                  add_tag(
                      way,
                      "boundary",
                      "administrative"
                  )

                  add_tag(
                      way,
                      "admin_level",
                      "2"
                  )

                  add_tag(
                      way,
                      "name",
                      name
                  )

                  # يسمح لـMapsforge برؤية اليابسة
                  add_tag(
                      way,
                      "natural",
                      "land"
                  )

          tree = ET.ElementTree(root)
          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Created:", OUTPUT)
          PY

          python3 convert_world.py

          ls -lh data/world-countries.osm

      # ---------------------------------------------------------
      # 8) تحويل السواحل إلى OSM
      #
      # فقط natural=coastline
      # لا boundary=maritime
      # ---------------------------------------------------------
      - name: Convert Natural Earth coastline to OSM
        run: |
          cat > convert_coastline.py <<'PY'
          import shapefile
          import os
          import xml.etree.ElementTree as ET

          INPUT = "data/natural-earth/coastline/ne_10m_coastline.shp"
          OUTPUT = "data/world-coastline.osm"

          sf = shapefile.Reader(INPUT)

          root = ET.Element(
              "osm",
              {
                  "version": "0.6",
                  "generator": "AlHaswa-NaturalEarth"
              }
          )

          next_node = -100000000
          next_way = -100000000

          for shape in sf.shapes():

              points = shape.points

              if len(points) < 2:
                  continue

              way = ET.SubElement(
                  root,
                  "way",
                  {"id": str(next_way)}
              )

              next_way -= 1

              for lon, lat in points:

                  node = ET.SubElement(
                      root,
                      "node",
                      {
                          "id": str(next_node),
                          "lat": str(lat),
                          "lon": str(lon)
                      }
                  )

                  ET.SubElement(
                      way,
                      "nd",
                      {"ref": str(next_node)}
                  )

                  next_node -= 1

              ET.SubElement(
                  way,
                  "tag",
                  {
                      "k": "natural",
                      "v": "coastline"
                  }
              )

          ET.ElementTree(root).write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Created:", OUTPUT)
          PY

          python3 convert_coastline.py

          ls -lh data/world-coastline.osm

      # ---------------------------------------------------------
      # 9) تحويل ملفات العالم إلى PBF
      # ---------------------------------------------------------
      - name: Convert world OSM XML to PBF
        run: |
          osmosis \
            --read-xml file=data/world-countries.osm \
            --write-pbf file=data/world-countries.pbf

          osmosis \
            --read-xml file=data/world-coastline.osm \
            --write-pbf file=data/world-coastline.pbf

      # ---------------------------------------------------------
      # 10) تنظيف اليمن من maritime relations
      #
      # نحذف العلاقات التي تحمل boundary=maritime.
      # لا نحذف الطرق أو المدن أو القرى أو السواحل.
      # ---------------------------------------------------------
      - name: Remove maritime boundaries from Yemen
        run: |
          osmium tags-filter \
            data/yemen/yemen.osm.pbf \
            'r/boundary=maritime' \
            --invert-match \
            -o data/yemen/yemen-clean.pbf \
            --overwrite

          echo "Yemen cleaned."

          ls -lh data/yemen/yemen-clean.pbf

      # ---------------------------------------------------------
      # 11) دمج العالم + السواحل + اليمن
      # ---------------------------------------------------------
      - name: Merge world and Yemen
        run: |
          osmium merge \
            data/world-countries.pbf \
            data/world-coastline.pbf \
            data/yemen/yemen-clean.pbf \
            -o data/AlHaswa-source.pbf \
            --overwrite

          ls -lh data/AlHaswa-source.pbf

      # ---------------------------------------------------------
      # 12) تنزيل Mapsforge Map Writer 0.25.0
      # ---------------------------------------------------------
      - name: Download Mapsforge Map Writer 0.25.0
        run: |
          wget -O mapsforge-map-writer.jar \
            "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0/mapsforge-map-writer-0.25.0-jar-with-dependencies.jar"

          ls -lh mapsforge-map-writer.jar

      # ---------------------------------------------------------
      # 13) إنشاء ملف Mapsforge
      #
      # ملاحظة:
      # نستخدم نفس أسلوب Map Writer/Osmosis المستخدم
      # في بناء خريطة اليمن الحالية.
      # ---------------------------------------------------------
      - name: Generate AlHaswa.map
        run: |
          mkdir -p app/src/main/assets

          mkdir -p ~/.openstreetmap/osmosis/plugins

          cp mapsforge-map-writer.jar \
            ~/.openstreetmap/osmosis/plugins/

          osmosis \
            --read-pbf file=data/AlHaswa-source.pbf \
            --map-writer \
            file=app/src/main/assets/AlHaswa.map \
            type=ram \
            map-start-position=15.3694,44.1910 \
            map-start-zoom=6

          ls -lh app/src/main/assets/AlHaswa.map

      # ---------------------------------------------------------
      # 14) فحص الملف
      # ---------------------------------------------------------
      - name: Verify generated map
        run: |
          test -s app/src/main/assets/AlHaswa.map

          echo "======================================"
          echo "AlHaswa.map generated successfully"
          echo "======================================"

          ls -lh app/src/main/assets/AlHaswa.map

      # ---------------------------------------------------------
      # 15) حفظ الملف داخل المستودع
      # ---------------------------------------------------------
      - name: Commit generated map
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add app/src/main/assets/AlHaswa.map

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "chore: generate unified AlHaswa Mapsforge map"

            git push
          fi
